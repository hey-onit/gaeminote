name: 시세 업데이트

on:
  schedule:
    - cron: "45 6 * * 1-5"    # 한국 장 마감 뒤 (15:45 KST)
    - cron: "35 21 * * 1-5"   # 미국 장 마감 뒤 (다음날 06:35 KST)
  workflow_dispatch:          # Actions 탭에서 'Run workflow'로 바로 실행

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yfinance pandas
      - run: python scripts/update_prices.py
      - name: 변경 사항 올리기
        run: |
          git config user.name "gaeminote-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "시세 업데이트 $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
